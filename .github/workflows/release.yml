name: Release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Build
        run: npm run build

      - name: Pull latest before release
        run: git pull --rebase origin master

      - name: Bump version
        id: bump
        run: |
          BUMP_TYPE="${{ inputs.bump || 'patch' }}"
          NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to $NEW_VERSION"

      - name: Sync server.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const server = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            server.version = '${VERSION}';
            server.packages[0].version = '${VERSION}';
            fs.writeFileSync('server.json', JSON.stringify(server, null, 2) + '\n');
          "

      - name: Commit and push release
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json server.json
          git commit -m "release: ${{ steps.bump.outputs.version }} [automated]"
          git tag ${{ steps.bump.outputs.version }}
          git push
          git push --tags

      - name: Publish to npm
        run: npm publish --access public

      - name: Wait for npm propagation
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Waiting for gitlab-docs-mcp@$VERSION to appear on npm..."
          for i in $(seq 1 10); do
            if npm view "gitlab-docs-mcp@$VERSION" version 2>/dev/null; then
              echo "Available on npm"
              break
            fi
            echo "Attempt $i/10 - not yet available, waiting 30s..."
            sleep 30
          done

      - name: Publish to MCP Registry
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true

      - name: Set lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.bump.outputs.version }}
